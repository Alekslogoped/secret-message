<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Секретное послание</title>

<style>

:root{
    --purple:#7559b7;
    --purple-dark:#59408f;
    --green:#78c98b;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Trebuchet MS",Arial,sans-serif;
    background:#e8e0f6;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* =========================
   ИГРА 16:9
========================= */

.game{
    width:100vw;
    height:100vh;

    max-width:177.78vh;
    max-height:56.25vw;

    position:relative;
    overflow:hidden;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:2vh 3vw;

    background-image:url("fon.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.content{
    position:relative;
    z-index:2;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
}

/* =========================
   ВЕРХ
========================= */

.topbar{
    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;

    min-height:7vh;
}

.title{
    margin:0;

    padding:.22em .85em;

    color:var(--purple-dark);

    font-size:clamp(24px,3vw,46px);
    font-weight:900;

    text-align:center;

    background:rgba(255,255,255,.70);

    border-radius:999px;

    box-shadow:0 5px 18px rgba(70,50,100,.08);

    backdrop-filter:blur(4px);
}

.progress{
    position:absolute;

    right:1vw;
    top:.3vh;

    padding:.55em 1em;

    background:rgba(255,255,255,.88);

    border:2px solid rgba(117,89,183,.15);

    border-radius:999px;

    color:var(--purple-dark);

    font-weight:900;

    font-size:clamp(12px,1.3vw,18px);

    box-shadow:0 5px 15px rgba(80,60,110,.10);
}

/* =========================
   ИНСТРУКЦИЯ
========================= */

.instruction{
    margin:.5vh 0 .6vh;

    padding:.35em 1.2em;

    text-align:center;

    color:#62556f;

    font-size:clamp(13px,1.4vw,19px);

    font-weight:700;

    background:rgba(255,255,255,.60);

    border-radius:999px;

    backdrop-filter:blur(3px);
}

/* =========================
   ЗАДАНИЕ
========================= */

.task-area{
    width:100%;

    flex:1;

    min-height:0;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:.5vh 2vw;
}

.secret-sentence{
    width:100%;

    display:flex;

    justify-content:center;
    align-items:flex-end;

    flex-wrap:wrap;

    gap:clamp(18px,2.8vw,45px);
}

/* =========================
   СЛОВА
========================= */

.secret-word{
    display:flex;

    gap:clamp(4px,.55vw,9px);

    padding:clamp(6px,.8vw,11px);

    border-radius:22px;

    background:rgba(255,255,255,.25);

    box-shadow:0 7px 22px rgba(80,60,110,.06);

    backdrop-filter:blur(2px);
}

.secret-letter{
    display:flex;

    flex-direction:column;

    align-items:center;

    gap:.55vh;
}

/* =========================
   КАРТИНКИ
========================= */

.picture{
    width:clamp(62px,7.1vw,108px);

    height:clamp(62px,7.1vw,108px);

    display:flex;

    justify-content:center;
    align-items:center;

    background:rgba(255,255,255,.88);

    border-radius:20px;

    border:3px solid rgba(255,255,255,.95);

    box-shadow:0 7px 18px rgba(68,49,92,.13);

    overflow:hidden;

    transition:.2s;
}

.picture img{
    width:90%;
    height:90%;

    object-fit:contain;

    display:block;

    pointer-events:none;

    user-select:none;
}

.picture.active{
    transform:translateY(-5px) scale(1.04);

    border-color:#9a7ad2;

    box-shadow:0 9px 24px rgba(117,89,183,.28);
}

/* =========================
   КЛЕТКИ БУКВ
========================= */

.letter-box{
    width:clamp(40px,4.6vw,66px);

    height:clamp(40px,4.6vw,66px);

    display:flex;

    justify-content:center;
    align-items:center;

    background:rgba(255,255,255,.96);

    border:3px solid #d3c1ec;

    border-radius:13px;

    font-size:clamp(22px,2.8vw,39px);

    font-weight:900;

    color:var(--purple-dark);

    box-shadow:0 4px 10px rgba(75,55,100,.10);

    transition:.2s;
}

.letter-box.current{
    border-color:var(--purple);

    box-shadow:
        0 0 0 4px rgba(117,89,183,.14),
        0 5px 13px rgba(70,50,100,.10);
}

.letter-box.correct{
    background:#e2f6e6;

    border-color:var(--green);

    animation:correctPop .28s ease;
}

@keyframes correctPop{
    50%{
        transform:scale(1.18);
    }
}

/* =========================
   СООБЩЕНИЯ
========================= */

.message{
    height:4vh;

    min-height:25px;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:0 1em;

    font-size:clamp(14px,1.5vw,20px);

    font-weight:900;

    color:var(--purple-dark);

    text-shadow:0 1px 2px white;
}

.message.error{
    color:#c64d59;

    animation:shake .28s linear;
}

@keyframes shake{

    25%{
        transform:translateX(-6px);
    }

    50%{
        transform:translateX(6px);
    }

    75%{
        transform:translateX(-4px);
    }
}

/* =========================
   КЛАВИАТУРА
========================= */

.keyboard{
    width:min(94%,1050px);

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:clamp(4px,.45vw,7px);

    padding:.7vh 1vw;

    background:rgba(255,255,255,.35);

    border-radius:22px;

    backdrop-filter:blur(3px);

    box-shadow:0 7px 20px rgba(75,55,100,.07);
}

.key{
    width:clamp(32px,3.7vw,52px);

    height:clamp(32px,3.7vw,52px);

    border:0;

    border-radius:10px;

    background:rgba(255,255,255,.96);

    color:#514165;

    font-size:clamp(14px,1.6vw,21px);

    font-weight:900;

    cursor:pointer;

    box-shadow:0 4px 10px rgba(65,48,90,.15);

    transition:.12s;
}

.key:hover{
    background:#f1e9ff;

    transform:translateY(-2px);
}

.key:active{
    transform:scale(.92);
}

.key.wrong{
    animation:keyWrong .28s;

    background:#ffe1e4;
}

@keyframes keyWrong{
    50%{
        transform:scale(.82);
    }
}

/* =========================
   ПОЗДРАВЛЕНИЕ
========================= */

.finish{
    position:absolute;

    inset:0;

    z-index:20;

    display:none;

    justify-content:center;
    align-items:center;

    background:rgba(245,238,255,.72);

    backdrop-filter:blur(6px);
}

.finish.show{
    display:flex;
}

.finish-card{
    width:min(72%,720px);

    text-align:center;

    background:rgba(255,255,255,.96);

    padding:3vh 5vw;

    border-radius:35px;

    box-shadow:0 20px 50px rgba(78,55,105,.20);

    animation:finishIn .5s ease;
}

@keyframes finishIn{

    from{
        opacity:0;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* =========================
   КАРТИНКА-НАГРАДА
========================= */

.finish-image{
    width:100%;

    height:clamp(130px,20vh,240px);

    display:flex;

    justify-content:center;
    align-items:center;

    margin:0 auto .5vh;
}

.finish-image img{
    max-width:100%;

    max-height:100%;

    width:auto;

    height:auto;

    object-fit:contain;

    display:block;

    animation:rewardPop .6s ease;
}

@keyframes rewardPop{

    0%{
        opacity:0;
        transform:scale(.5) rotate(-5deg);
    }

    70%{
        transform:scale(1.08) rotate(2deg);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }
}

.finish h2{
    margin:.15em 0;

    font-size:clamp(30px,4vw,60px);

    color:var(--purple-dark);
}

.finish p{
    margin:.35em 0 1em;

    font-size:clamp(16px,2vw,27px);

    color:#70657b;
}

.finish-button{
    border:0;

    border-radius:999px;

    padding:.8em 2.2em;

    background:linear-gradient(
        135deg,
        #9477d1,
        #7050b0
    );

    color:white;

    font-size:clamp(15px,1.6vw,22px);

    font-weight:900;

    cursor:pointer;

    box-shadow:0 7px 18px rgba(89,64,143,.28);

    transition:.2s;
}

.finish-button:hover{
    transform:scale(1.04);
}

/* =========================
   ЗВЁЗДОЧКИ
========================= */

.star{
    position:absolute;

    z-index:30;

    pointer-events:none;

    font-size:clamp(18px,2vw,28px);

    animation:starFly .8s ease-out forwards;
}

@keyframes starFly{

    0%{
        opacity:1;

        transform:translate(0,0) scale(.5);
    }

    100%{
        opacity:0;

        transform:
            translate(var(--x),var(--y))
            rotate(180deg)
            scale(1.4);
    }
}

/* =========================
   АДАПТАЦИЯ
========================= */

@media(max-aspect-ratio:4/3){

    html,body{
        overflow:auto;
    }

    .game{
        width:100%;

        height:auto;

        min-height:100vh;

        max-width:none;

        max-height:none;

        padding:15px;
    }

    .task-area{
        min-height:42vh;
    }

    .progress{
        position:relative;

        right:auto;

        top:auto;

        margin-left:10px;
    }

    .secret-sentence{
        margin:15px 0;
    }

    .finish-card{
        width:90%;
    }
}

</style>
</head>

<body>

<main class="game" id="game">

<div class="content">

    <div class="topbar">

        <h1 class="title">
            🔐 Секретное послание
        </h1>

        <div
            class="progress"
            id="progress">
        </div>

    </div>

    <div class="instruction">
        Назови картинки.
        Определи первую букву каждого слова
        и расшифруй послание!
    </div>

    <section class="task-area">

        <div
            class="secret-sentence"
            id="secretSentence">
        </div>

    </section>

    <div
        class="message"
        id="message">
    </div>

    <div
        class="keyboard"
        id="keyboard">
    </div>

</div>


<!-- ПОЗДРАВЛЕНИЕ -->

<div
    class="finish"
    id="finish">

    <div class="finish-card">

        <div class="finish-image">

            <img
                id="finishImage"
                src=""
                alt="Награда">

        </div>

        <h2>
            Молодец!
        </h2>

        <p id="finishText">
            Секретное послание разгадано!
        </p>

        <button
            class="finish-button"
            id="finishButton">

            Дальше ➜

        </button>

    </div>

</div>

</main>


<script>

/* =========================================================
   УРОВНИ
========================================================= */

const LEVELS = [


/* =========================================================
   УРОВЕНЬ 1
   КОТ | ЕСТ | СУП
========================================================= */

{

    finish:"finish/finish-01.png",

    words:[

        /* КОТ */

        [

            {
                image:"images1/img-01.png",
                letter:"К"
            },

            {
                image:"images1/img-02.png",
                letter:"О"
            },

            {
                image:"images1/img-03.png",
                letter:"Т"
            }

        ],


        /* ЕСТ */

        [

            {
                image:"images1/img-04.png",
                letter:"Е"
            },

            {
                image:"images1/img-05.png",
                letter:"С"
            },

            {
                image:"images1/img-06.png",
                letter:"Т"
            }

        ],


        /* СУП */

        [

            {
                image:"images1/img-07.png",
                letter:"С"
            },

            {
                image:"images1/img-08.png",
                letter:"У"
            },

            {
                image:"images1/img-09.png",
                letter:"П"
            }

        ]

    ]

},


/* =========================================================
   УРОВЕНЬ 2
   ЛИСА | ЕСТ | МЁД
========================================================= */

{

    finish:"finish/finish-02.png",

    words:[

        /* ЛИСА */

        [

            {
                image:"images2/img-01.png",
                letter:"Л"
            },

            {
                image:"images2/img-02.png",
                letter:"И"
            },

            {
                image:"images2/img-03.png",
                letter:"С"
            },

            {
                image:"images2/img-04.png",
                letter:"А"
            }

        ],


        /* ЕСТ */

        [

            {
                image:"images2/img-05.png",
                letter:"Е"
            },

            {
                image:"images2/img-06.png",
                letter:"С"
            },

            {
                image:"images2/img-07.png",
                letter:"Т"
            }

        ],


        /* МЁД */

        [

            {
                image:"images2/img-08.png",
                letter:"М"
            },

            {
                image:"images2/img-09.png",
                letter:"Ё"
            },

            {
                image:"images2/img-10.png",
                letter:"Д"
            }

        ]

    ]

},


/* =========================================================
   УРОВЕНЬ 3
   ПЁС | НЁС | МЯЧ
========================================================= */

{

    finish:"finish/finish-03.png",

    words:[

        /* ПЁС */

        [

            {
                image:"images3/img-01.png",
                letter:"П"
            },

            {
                image:"images3/img-02.png",
                letter:"Ё"
            },

            {
                image:"images3/img-03.png",
                letter:"С"
            }

        ],


        /* НЁС */

        [

            {
                image:"images3/img-04.png",
                letter:"Н"
            },

            {
                image:"images3/img-05.png",
                letter:"Ё"
            },

            {
                image:"images3/img-06.png",
                letter:"С"
            }

        ],


        /* МЯЧ */

        [

            {
                image:"images3/img-07.png",
                letter:"М"
            },

            {
                image:"images3/img-08.png",
                letter:"Я"
            },

            {
                image:"images3/img-09.png",
                letter:"Ч"
            }

        ]

    ]

}

];


/* =========================================================
   РУССКАЯ КЛАВИАТУРА
========================================================= */

const ALPHABET=[

    "А","Б","В","Г","Д","Е","Ё",
    "Ж","З","И","Й","К","Л","М",
    "Н","О","П","Р","С","Т","У",
    "Ф","Х","Ц","Ч","Ш","Щ","Ъ",
    "Ы","Ь","Э","Ю","Я"

];


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let currentLevel=0;

let flatLetters=[];

let currentLetterIndex=0;

let audioContext=null;

let levelCompleted=false;


/* =========================================================
   ЭЛЕМЕНТЫ
========================================================= */

const game=
    document.getElementById("game");

const secretSentence=
    document.getElementById("secretSentence");

const keyboard=
    document.getElementById("keyboard");

const message=
    document.getElementById("message");

const progress=
    document.getElementById("progress");

const finish=
    document.getElementById("finish");

const finishImage=
    document.getElementById("finishImage");

const finishText=
    document.getElementById("finishText");

const finishButton=
    document.getElementById("finishButton");


/* =========================================================
   КЛАВИАТУРА
========================================================= */

function createKeyboard(){

    keyboard.innerHTML="";

    ALPHABET.forEach(letter=>{

        const button=
            document.createElement("button");

        button.className="key";

        button.textContent=letter;

        button.dataset.letter=letter;

        button.addEventListener(
            "click",
            ()=>checkLetter(letter,button)
        );

        keyboard.appendChild(button);

    });

}


/* =========================================================
   ЗАГРУЗКА УРОВНЯ
========================================================= */

function loadLevel(){

    secretSentence.innerHTML="";

    message.textContent="";

    message.className="message";

    finish.classList.remove("show");

    currentLetterIndex=0;

    flatLetters=[];

    levelCompleted=false;


    const level=
        LEVELS[currentLevel];


    level.words.forEach(word=>{

        const wordElement=
            document.createElement("div");

        wordElement.className=
            "secret-word";


        word.forEach(item=>{

            flatLetters.push(item);


            const letterItem=
                document.createElement("div");

            letterItem.className=
                "secret-letter";


            /* КАРТИНКА */

            const picture=
                document.createElement("div");

            picture.className=
                "picture";


            const img=
                document.createElement("img");

            img.src=item.image;

            img.alt="";

            img.draggable=false;


            picture.appendChild(img);


            /* КЛЕТКА */

            const box=
                document.createElement("div");

            box.className=
                "letter-box";


            letterItem.appendChild(
                picture
            );


            letterItem.appendChild(
                box
            );


            wordElement.appendChild(
                letterItem
            );

        });


        secretSentence.appendChild(
            wordElement
        );

    });


    progress.textContent=
        `${currentLevel+1} / ${LEVELS.length}`;


    updateCurrentBox();

}


/* =========================================================
   АКТИВНАЯ БУКВА
========================================================= */

function updateCurrentBox(){

    const boxes=
        document.querySelectorAll(
            ".letter-box"
        );


    const pictures=
        document.querySelectorAll(
            ".picture"
        );


    boxes.forEach(box=>{

        box.classList.remove(
            "current"
        );

    });


    pictures.forEach(picture=>{

        picture.classList.remove(
            "active"
        );

    });


    if(
        currentLetterIndex <
        boxes.length
    ){

        boxes[
            currentLetterIndex
        ].classList.add(
            "current"
        );


        pictures[
            currentLetterIndex
        ].classList.add(
            "active"
        );

    }

}


/* =========================================================
   ПРОВЕРКА БУКВЫ
========================================================= */

function checkLetter(
    selectedLetter,
    button
){

    if(levelCompleted){
        return;
    }


    if(
        currentLetterIndex >=
        flatLetters.length
    ){
        return;
    }


    const correctLetter=
        flatLetters[
            currentLetterIndex
        ].letter;


    if(
        selectedLetter ===
        correctLetter
    ){

        const boxes=
            document.querySelectorAll(
                ".letter-box"
            );


        boxes[
            currentLetterIndex
        ].textContent=
            selectedLetter;


        boxes[
            currentLetterIndex
        ].classList.remove(
            "current"
        );


        boxes[
            currentLetterIndex
        ].classList.add(
            "correct"
        );


        playCorrectSound();


        createStars(
            boxes[
                currentLetterIndex
            ]
        );


        currentLetterIndex++;


        message.className=
            "message";


        message.textContent=
            "✅ Верно!";


        updateCurrentBox();


        if(
            currentLetterIndex ===
            flatLetters.length
        ){

            levelCompleted=true;


            message.textContent=
                "🎉 Послание разгадано!";


            setTimeout(
                showLevelFinish,
                650
            );

        }

    }

    else{

        message.className=
            "message error";


        message.textContent=
            "Попробуй ещё раз 🙂";


        button.classList.remove(
            "wrong"
        );


        void button.offsetWidth;


        button.classList.add(
            "wrong"
        );

    }

}


/* =========================================================
   ПОЗДРАВЛЕНИЕ
========================================================= */

function showLevelFinish(){

    const level=
        LEVELS[currentLevel];


    finishImage.src=
        level.finish;


    finishText.textContent=
        "Секретное послание разгадано!";


    if(
        currentLevel <
        LEVELS.length-1
    ){

        finishButton.textContent=
            "Дальше ➜";

    }

    else{

        finishButton.textContent=
            "Играть ещё раз";

    }


    finish.classList.add(
        "show"
    );


    playFinalSound();

}


/* =========================================================
   ДАЛЬШЕ / СНАЧАЛА
========================================================= */

finishButton.addEventListener(
    "click",
    ()=>{

        if(
            currentLevel <
            LEVELS.length-1
        ){

            currentLevel++;

            loadLevel();

        }

        else{

            currentLevel=0;

            loadLevel();

        }

    }
);


/* =========================================================
   ЗВУК ПРАВИЛЬНОЙ БУКВЫ
========================================================= */

function playCorrectSound(){

    try{

        if(!audioContext){

            audioContext=
                new(
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        const oscillator=
            audioContext.createOscillator();


        const gain=
            audioContext.createGain();


        oscillator.type="sine";


        oscillator.frequency
            .setValueAtTime(
                520,
                audioContext.currentTime
            );


        oscillator.frequency
            .exponentialRampToValueAtTime(
                760,
                audioContext.currentTime+.12
            );


        gain.gain
            .setValueAtTime(
                .12,
                audioContext.currentTime
            );


        gain.gain
            .exponentialRampToValueAtTime(
                .001,
                audioContext.currentTime+.18
            );


        oscillator.connect(gain);


        gain.connect(
            audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
            audioContext.currentTime+.18
        );

    }

    catch(error){

        console.log(
            "Звук недоступен"
        );

    }

}


/* =========================================================
   ЗВУК ПОЗДРАВЛЕНИЯ
========================================================= */

function playFinalSound(){

    try{

        if(!audioContext){

            audioContext=
                new(
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        const notes=[
            523,
            659,
            784,
            1046
        ];


        notes.forEach(
            (frequency,index)=>{


                const oscillator=
                    audioContext
                        .createOscillator();


                const gain=
                    audioContext
                        .createGain();


                oscillator.frequency.value=
                    frequency;


                gain.gain.value=.08;


                oscillator.connect(
                    gain
                );


                gain.connect(
                    audioContext.destination
                );


                const start=
                    audioContext.currentTime+
                    index*.12;


                oscillator.start(
                    start
                );


                oscillator.stop(
                    start+.18
                );

            }
        );

    }

    catch(error){

        console.log(
            "Финальный звук недоступен"
        );

    }

}


/* =========================================================
   ЗВЁЗДОЧКИ
========================================================= */

function createStars(element){

    const rect=
        element.getBoundingClientRect();


    const gameRect=
        game.getBoundingClientRect();


    const centerX=
        rect.left-
        gameRect.left+
        rect.width/2;


    const centerY=
        rect.top-
        gameRect.top+
        rect.height/2;


    const symbols=[
        "⭐",
        "✨",
        "💫"
    ];


    for(
        let i=0;
        i<6;
        i++
    ){

        const star=
            document.createElement(
                "div"
            );


        star.className=
            "star";


        star.textContent=
            symbols[
                Math.floor(
                    Math.random()*
                    symbols.length
                )
            ];


        star.style.left=
            centerX+"px";


        star.style.top=
            centerY+"px";


        star.style.setProperty(
            "--x",
            (
                Math.random()*120-60
            )+"px"
        );


        star.style.setProperty(
            "--y",
            (
                Math.random()*100-70
            )+"px"
        );


        game.appendChild(
            star
        );


        setTimeout(
            ()=>star.remove(),
            850
        );

    }

}


/* =========================================================
   ЗАПУСК
========================================================= */

createKeyboard();

loadLevel();
