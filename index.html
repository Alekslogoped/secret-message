<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Секретное послание</title>

<style>

/* =========================================================
   ОСНОВНЫЕ НАСТРОЙКИ
========================================================= */

:root{
    --purple:#7559b7;
    --purple-dark:#59408f;
    --purple-light:#e9ddff;

    --pink:#f3b5d4;
    --blue:#b9def5;

    --green:#78c98b;
    --red:#ef7f86;

    --text:#4d405f;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    font-family:
        "Trebuchet MS",
        Arial,
        sans-serif;

    background:#e8e0f6;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}


/* =========================================================
   ИГРОВОЕ ПОЛЕ 16:9
========================================================= */

.game{

    width:100vw;
    height:100vh;

    max-width:177.78vh;
    max-height:56.25vw;

    position:relative;
    overflow:hidden;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:2vh 3vw;

    /* ФОН ИГРЫ */

    background-image:url("fon.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}


.content{

    position:relative;
    z-index:2;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
}


/* =========================================================
   ВЕРХНЯЯ ЧАСТЬ
========================================================= */

.topbar{

    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;

    min-height:7vh;
}


.title{

    margin:0;

    padding:.25em .8em;

    color:var(--purple-dark);

    font-size:
        clamp(24px,3vw,46px);

    font-weight:900;

    text-align:center;

    background:
        rgba(255,255,255,.68);

    border-radius:999px;

    box-shadow:
        0 5px 18px
        rgba(70,50,100,.08);

    backdrop-filter:
        blur(4px);
}


.progress{

    position:absolute;

    right:1vw;
    top:.3vh;

    padding:.55em 1em;

    background:
        rgba(255,255,255,.85);

    border:
        2px solid
        rgba(117,89,183,.15);

    border-radius:999px;

    color:
        var(--purple-dark);

    font-weight:900;

    font-size:
        clamp(12px,1.3vw,18px);

    box-shadow:
        0 5px 15px
        rgba(80,60,110,.10);
}


/* =========================================================
   ИНСТРУКЦИЯ
========================================================= */

.instruction{

    margin:.6vh 0 .8vh;

    padding:.35em 1.2em;

    text-align:center;

    color:#62556f;

    font-size:
        clamp(13px,1.4vw,19px);

    font-weight:700;

    background:
        rgba(255,255,255,.58);

    border-radius:999px;

    backdrop-filter:
        blur(3px);
}


/* =========================================================
   ОБЛАСТЬ С ШИФРОМ
========================================================= */

.task-area{

    width:100%;

    flex:1;

    min-height:0;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:
        1vh 3vw;
}


.secret-sentence{

    width:100%;

    display:flex;

    justify-content:center;
    align-items:flex-end;

    flex-wrap:wrap;

    gap:
        clamp(
            20px,
            3vw,
            50px
        );
}


/* =========================================================
   ОТДЕЛЬНОЕ СЛОВО
========================================================= */

.secret-word{

    display:flex;

    gap:
        clamp(
            5px,
            .7vw,
            10px
        );

    padding:
        clamp(
            8px,
            1vw,
            14px
        );

    border-radius:22px;

    background:
        rgba(255,255,255,.34);

    box-shadow:
        0 7px 22px
        rgba(80,60,110,.07);

    backdrop-filter:
        blur(2px);
}


/* =========================================================
   КАРТИНКА + КЛЕТКА
========================================================= */

.secret-letter{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:.7vh;
}


/* КАРТИНКА */

.picture{

    width:
        clamp(
            54px,
            6.5vw,
            95px
        );

    height:
        clamp(
            54px,
            6.5vw,
            95px
        );

    display:flex;

    justify-content:center;
    align-items:center;

    background:
        rgba(255,255,255,.94);

    border-radius:20px;

    font-size:
        clamp(
            32px,
            4.7vw,
            67px
        );

    border:
        3px solid
        rgba(255,255,255,.95);

    box-shadow:
        0 7px 18px
        rgba(68,49,92,.13);

    transition:
        transform .2s,
        border .2s,
        box-shadow .2s;
}


/* ТЕКУЩАЯ КАРТИНКА */

.picture.active{

    transform:
        translateY(-5px)
        scale(1.04);

    border-color:
        #9a7ad2;

    box-shadow:
        0 9px 24px
        rgba(117,89,183,.28);
}


/* =========================================================
   КЛЕТКА ДЛЯ БУКВЫ
========================================================= */

.letter-box{

    width:
        clamp(
            40px,
            4.8vw,
            68px
        );

    height:
        clamp(
            40px,
            4.8vw,
            68px
        );

    display:flex;

    justify-content:center;
    align-items:center;

    background:
        rgba(255,255,255,.95);

    border:
        3px solid
        #d3c1ec;

    border-radius:13px;

    font-size:
        clamp(
            22px,
            2.8vw,
            39px
        );

    font-weight:900;

    color:
        var(--purple-dark);

    box-shadow:
        0 4px 10px
        rgba(75,55,100,.10);

    transition:.2s;
}


/* АКТИВНАЯ КЛЕТКА */

.letter-box.current{

    border-color:
        var(--purple);

    box-shadow:
        0 0 0 4px
        rgba(117,89,183,.14),
        0 5px 13px
        rgba(70,50,100,.10);
}


/* ПРАВИЛЬНАЯ БУКВА */

.letter-box.correct{

    background:
        #e2f6e6;

    border-color:
        var(--green);

    animation:
        correctPop .28s ease;
}


@keyframes correctPop{

    50%{
        transform:
            scale(1.18);
    }

}


/* =========================================================
   СООБЩЕНИЯ
========================================================= */

.message{

    height:4.5vh;

    min-height:26px;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:
        0 1em;

    font-size:
        clamp(
            14px,
            1.5vw,
            20px
        );

    font-weight:900;

    color:
        var(--purple-dark);

    text-shadow:
        0 1px 2px white;
}


.message.error{

    color:#c64d59;

    animation:
        shake .28s linear;
}


@keyframes shake{

    25%{
        transform:
            translateX(-6px);
    }

    50%{
        transform:
            translateX(6px);
    }

    75%{
        transform:
            translateX(-4px);
    }

}


/* =========================================================
   КЛАВИАТУРА
========================================================= */

.keyboard{

    width:min(
        94%,
        1050px
    );

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:
        clamp(
            4px,
            .45vw,
            7px
        );

    padding:
        .8vh 1vw;

    background:
        rgba(255,255,255,.38);

    border-radius:22px;

    backdrop-filter:
        blur(3px);

    box-shadow:
        0 7px 20px
        rgba(75,55,100,.07);
}


/* КНОПКИ КЛАВИАТУРЫ */

.key{

    width:
        clamp(
            32px,
            3.7vw,
            52px
        );

    height:
        clamp(
            32px,
            3.7vw,
            52px
        );

    border:0;

    border-radius:10px;

    background:
        rgba(255,255,255,.96);

    color:
        #514165;

    font-size:
        clamp(
            14px,
            1.6vw,
            21px
        );

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 4px 10px
        rgba(65,48,90,.15);

    transition:
        transform .12s,
        background .12s,
        box-shadow .12s;
}


.key:hover{

    background:
        #f1e9ff;

    transform:
        translateY(-2px);

    box-shadow:
        0 6px 13px
        rgba(65,48,90,.18);
}


.key:active{

    transform:
        scale(.92);
}


/* НЕПРАВИЛЬНАЯ БУКВА */

.key.wrong{

    animation:
        keyWrong .28s;

    background:
        #ffe1e4;
}


@keyframes keyWrong{

    50%{
        transform:
            scale(.82);
    }

}


/* =========================================================
   НИЖНЯЯ ПАНЕЛЬ
========================================================= */

.bottom{

    width:100%;

    min-height:7vh;

    display:flex;

    justify-content:center;
    align-items:center;
}


/* =========================================================
   КНОПКА ДАЛЬШЕ
========================================================= */

.next-btn{

    border:0;

    padding:
        .7em 1.8em;

    border-radius:999px;

    background:
        linear-gradient(
            135deg,
            #9477d1,
            #7050b0
        );

    color:white;

    font-size:
        clamp(
            14px,
            1.5vw,
            20px
        );

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 7px 18px
        rgba(89,64,143,.28);

    opacity:0;

    pointer-events:none;

    transform:
        translateY(8px);

    transition:.25s;
}


.next-btn.show{

    opacity:1;

    pointer-events:auto;

    transform:
        translateY(0);
}


.next-btn:hover{

    transform:
        scale(1.04);
}


/* =========================================================
   ФИНАЛЬНЫЙ ЭКРАН
========================================================= */

.finish{

    position:absolute;

    inset:0;

    z-index:20;

    display:none;

    justify-content:center;
    align-items:center;

    background:
        rgba(245,238,255,.72);

    backdrop-filter:
        blur(6px);
}


.finish.show{

    display:flex;
}


.finish-card{

    text-align:center;

    background:
        rgba(255,255,255,.94);

    padding:
        4vh 6vw;

    border-radius:35px;

    box-shadow:
        0 20px 50px
        rgba(78,55,105,.20);

    animation:
        finishIn .5s ease;
}


@keyframes finishIn{

    from{

        opacity:0;

        transform:
            scale(.7);
    }

}


.finish-icon{

    font-size:
        clamp(
            65px,
            9vw,
            130px
        );
}


.finish h2{

    margin:.2em 0;

    font-size:
        clamp(
            30px,
            4vw,
            60px
        );

    color:
        var(--purple-dark);
}


.finish p{

    font-size:
        clamp(
            16px,
            2vw,
            27px
        );

    color:
        #70657b;
}


.restart{

    border:0;

    border-radius:999px;

    padding:
        .8em 1.8em;

    background:
        var(--purple);

    color:white;

    font-size:
        clamp(
            15px,
            1.5vw,
            20px
        );

    font-weight:900;

    cursor:pointer;
}


/* =========================================================
   ЗВЁЗДОЧКИ
========================================================= */

.star{

    position:absolute;

    z-index:30;

    pointer-events:none;

    font-size:
        clamp(
            18px,
            2vw,
            28px
        );

    animation:
        starFly .8s
        ease-out
        forwards;
}


@keyframes starFly{

    0%{

        opacity:1;

        transform:
            translate(0,0)
            scale(.5);
    }

    100%{

        opacity:0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            rotate(180deg)
            scale(1.4);
    }

}


/* =========================================================
   АДАПТАЦИЯ
========================================================= */

@media(max-aspect-ratio:4/3){

    html,
    body{
        overflow:auto;
    }


    .game{

        width:100%;

        height:auto;

        min-height:100vh;

        max-width:none;
        max-height:none;

        padding:15px;

        background-size:cover;
    }


    .task-area{

        min-height:42vh;
    }


    .progress{

        position:relative;

        right:auto;
        top:auto;

        margin-left:10px;
    }


    .secret-sentence{

        margin:
            15px 0;
    }

}

</style>
</head>


<body>


<main
    class="game"
    id="game">


<div class="content">


    <!-- ЗАГОЛОВОК -->

    <div class="topbar">

        <h1 class="title">

        </h1>


        <div
            class="progress"
            id="progress">
        </div>

    </div>

        и расшифруй послание!

    <!-- СООБЩЕНИЕ -->

    <div
        class="message"
        id="message">

    <!-- КЛАВИАТУРА -->

    <div
        class="keyboard"
        id="keyboard">
    </div>



    <!-- КНОПКА ДАЛЬШЕ -->

    <div class="bottom">

        <button
            class="next-btn"
            id="nextButton">

            Следующее задание ➜

        </button>

    </div>


</div>



<!-- =====================================================
     ФИНАЛ
===================================================== -->

<div
    class="finish"
    id="finish">


    <div class="finish-card">


        <div class="finish-icon">

            🏆

        </div>


        <h2>

            Молодец!

        </h2>


        <p>

            Все секретные послания разгаданы!

        </p>


        <button
            class="restart"
            id="restart">

            Играть ещё раз

        </button>


    </div>


</div>


</main>



<script>


/* =========================================================

========================================================= */


const LEVELS = [

[

    [

        {

            letter:"М"
        },

        {
            picture:"🍉",

        },

        {
            picture:"🐭",

            letter:"М"
        },

        {

            letter:"А"
        }

    ],


    [

        {
            picture:"🍅",
            name:"помидор",
            letter:"П"
        },

        {

        }

    ]

],



/* =========================================================

   ЛИСА ИДЁТ

[

    [

        {
            picture:"🦊",

        },

        },

        {

            letter:"С"
        },

        {
            picture:"🍉",
            name:"арбуз",
            letter:"А"
        }

    ],


    [

        {
            picture:"🦃",
            name:"индюк",
            letter:"И"
        },

        {
            picture:"🏠",

        },

        },

            letter:"Т"
        }

    ]

],



/* =========================================================
   УРОВЕНЬ 4

   МИША ЕСТ СУП
========================================================= */

[

    [

        {
            picture:"🐭",
            name:"мышь",
            letter:"М"
        },

        {

            letter:"И"
        },

        {

    [

        },

    [

/* =========================================================
   РУССКАЯ КЛАВИАТУРА

const ALPHABET = [

    "А","Б","В","Г","Д","Е","Ё",
    "Ж","З","И","Й","К","Л","М",
    "Н","О","П","Р","С","Т","У",
    "Ф","Х","Ц","Ч","Ш","Щ","Ъ",
    "Ы","Ь","Э","Ю","Я"

];



/* =========================================================
   СОСТОЯНИЕ ИГРЫ
========================================================= */


let currentLevel = 0;

let flatLetters = [];

let currentLetterIndex = 0;

let audioContext = null;



/* =========================================================
   ЭЛЕМЕНТЫ
========================================================= */


const game =
    document.getElementById(
        "game"
    );


const secretSentence =
    document.getElementById(
        "secretSentence"
    );


const keyboard =
    document.getElementById(
        "keyboard"
    );


const message =
    document.getElementById(
        "message"
    );


const progress =

    );


const nextButton =

    );


const finish =
    document.getElementById(
        "finish"
    );


const restart =
    document.getElementById(
        "restart"
    );



/* =========================================================
   СОЗДАНИЕ КЛАВИАТУРЫ
========================================================= */


function createKeyboard(){

    keyboard.innerHTML = "";


    ALPHABET.forEach(
        letter => {


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "key";


            button.textContent =
                letter;


            button.dataset.letter =
                letter;


            button.addEventListener(
                "click",
                () => {

                    checkLetter(
                        letter,
                        button
                    );

                }
            );


            keyboard.appendChild(
                button
            );

        }
    );

}



/* =========================================================
   ЗАГРУЗКА УРОВНЯ
========================================================= */


function loadLevel(){


    secretSentence.innerHTML =
        "";


    message.textContent =
        "";


    message.className =
        "message";


    nextButton.classList.remove(
        "show"
    );


    currentLetterIndex =
        0;


    flatLetters =
        [];


    const level =
        LEVELS[
            currentLevel
        ];



    level.forEach(
        word => {


            const wordElement =
                document.createElement(
                    "div"
                );


            wordElement.className =
                "secret-word";



            word.forEach(
                item => {


                    flatLetters.push(
                        item
                    );


                    const letterItem =
                        document.createElement(
                            "div"
                        );


                    letterItem.className =
                        "secret-letter";



                    const picture =
                        document.createElement(
                            "div"
                        );


                    picture.className =
                        "picture";


                    picture.textContent =
                        item.picture;


                    picture.title =
                        item.name;



                    const box =
                        document.createElement(
                            "div"
                        );


                    box.className =
                        "letter-box";



                    letterItem.appendChild(
                        picture
                    );


                    letterItem.appendChild(
                        box
                    );


                    wordElement.appendChild(
                        letterItem
                    );

                }
            );



            secretSentence.appendChild(
                wordElement
            );

        }
    );



    progress.textContent =
        `${currentLevel + 1} / ${LEVELS.length}`;


    updateCurrentBox();

}



/* =========================================================
   АКТИВНАЯ КЛЕТКА
========================================================= */


function updateCurrentBox(){


    const boxes =
        document.querySelectorAll(
            ".letter-box"
        );


    const pictures =
        document.querySelectorAll(
            ".picture"
        );



    boxes.forEach(
        box => {

            box.classList.remove(
                "current"
            );

        }
    );



    pictures.forEach(
        picture => {

            picture.classList.remove(
                "active"
            );

        }
    );



    if(
        currentLetterIndex <
        boxes.length
    ){

        boxes[
            currentLetterIndex
        ].classList.add(
            "current"
        );


        pictures[
            currentLetterIndex
        ].classList.add(
            "active"
        );

    }

}



/* =========================================================
   ПРОВЕРКА БУКВЫ
========================================================= */


function checkLetter(
    selectedLetter,
    button
){


    if(
        currentLetterIndex >=
        flatLetters.length
    ){

        return;

    }



    const correctLetter =
        flatLetters[
            currentLetterIndex
        ].letter;



    if(
        selectedLetter ===
        correctLetter
    ){


        const boxes =
            document.querySelectorAll(
                ".letter-box"
            );



        boxes[
            currentLetterIndex
        ].textContent =
            selectedLetter;



        boxes[
            currentLetterIndex
        ].classList.remove(
            "current"
        );



        boxes[
            currentLetterIndex
        ].classList.add(
            "correct"
        );



        playCorrectSound();



        createStars(
            boxes[
                currentLetterIndex
            ]
        );



        currentLetterIndex++;



        message.className =
            "message";


        message.textContent =
            "✅ Верно!";



        updateCurrentBox();



        if(
            currentLetterIndex ===
            flatLetters.length
        ){


            message.textContent =
                "🎉 Секретное послание разгадано!";


            setTimeout(
                () => {

                    nextButton.classList.add(
                        "show"
                    );

                },
                350
            );

        }

    }


    else{


        message.className =
            "message error";


        message.textContent =
            "Попробуй ещё раз 🙂";



        button.classList.remove(
            "wrong"
        );


        void button.offsetWidth;


        button.classList.add(
            "wrong"
        );

    }

}



/* =========================================================
   ЗВУК ПРАВИЛЬНОГО ОТВЕТА
========================================================= */


function playCorrectSound(){


    try{


        if(
            !audioContext
        ){


            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }



        const oscillator =
            audioContext.createOscillator();



        const gain =
            audioContext.createGain();



        oscillator.type =
            "sine";



        oscillator.frequency
            .setValueAtTime(

                520,

                audioContext
                    .currentTime

            );



        oscillator.frequency
            .exponentialRampToValueAtTime(

                760,

                audioContext
                    .currentTime
                    + .12

            );



        gain.gain
            .setValueAtTime(

                .12,

                audioContext
                    .currentTime

            );



        gain.gain
            .exponentialRampToValueAtTime(

                .001,

                audioContext
                    .currentTime
                    + .18

            );



        oscillator.connect(
            gain
        );


        gain.connect(
            audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
            audioContext.currentTime
            + .18
        );

    }


    catch(error){

        console.log(
            "Звук недоступен"
        );

    }

}



/* =========================================================
   ЗВЁЗДОЧКИ
========================================================= */


function createStars(
    element
){


    const rect =
        element.getBoundingClientRect();



    const gameRect =
        game.getBoundingClientRect();



    const centerX =

        rect.left
        - gameRect.left
        + rect.width / 2;



    const centerY =

        rect.top
        - gameRect.top
        + rect.height / 2;



    const symbols = [

        "⭐",
        "✨",
        "💫"

    ];



    for(
        let i = 0;
        i < 6;
        i++
    ){


        const star =
            document.createElement(
                "div"
            );


        star.className =
            "star";



        star.textContent =

            symbols[
                Math.floor(
                    Math.random()
                    *
                    symbols.length
                )
            ];



        star.style.left =
            centerX + "px";


        star.style.top =
            centerY + "px";



        star.style.setProperty(

            "--x",

            (
                Math.random()
                * 120
                - 60
            )
            + "px"

        );



        star.style.setProperty(

            "--y",

            (
                Math.random()
                * 100
                - 70
            )
            + "px"

        );



        game.appendChild(
            star
        );



        setTimeout(
            () => {

                star.remove();

            },
            850
        );

    }

}



/* =========================================================
   СЛЕДУЮЩЕЕ ЗАДАНИЕ
========================================================= */


nextButton.addEventListener(
    "click",
    () => {


        currentLevel++;



        if(
            currentLevel >=
            LEVELS.length
        ){


            showFinish();

            return;

        }



        loadLevel();

    }
);



/* =========================================================
   ФИНАЛ
========================================================= */


function showFinish(){


    finish.classList.add(
        "show"
    );


    playFinalSound();

}



/* =========================================================
   ФИНАЛЬНЫЙ ЗВУК
========================================================= */


function playFinalSound(){


    try{


        if(
            !audioContext
        ){


            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }



        const notes = [

            523,
            659,
            784,
            1046

        ];



        notes.forEach(
            (
                frequency,
                index
            ) => {


                const oscillator =
                    audioContext
                        .createOscillator();



                const gain =
                    audioContext
                        .createGain();



                oscillator.frequency.value =
                    frequency;



                gain.gain.value =
                    .08;



                oscillator.connect(
                    gain
                );


                gain.connect(
                    audioContext.destination
                );



                const start =

                    audioContext
                        .currentTime
                    +
                    index * .12;



                oscillator.start(
                    start
                );



                oscillator.stop(
                    start + .18
                );

            }
        );

    }


    catch(error){

        console.log(
            "Финальный звук недоступен"
        );

    }

}



/* =========================================================
   ИГРАТЬ ЕЩЁ РАЗ
========================================================= */


restart.addEventListener(
    "click",
    () => {


        currentLevel =
            0;


        finish.classList.remove(
            "show"
        );


        loadLevel();

    }
);

createKeyboard();

loadLevel();
